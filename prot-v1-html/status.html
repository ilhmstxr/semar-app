<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Status Tong Pintar - sttaus-tong-pintar</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#225E26',
                            primary: '#2E7D32',
                            light: '#E8F5E9',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Pengaturan dasar untuk memastikan tampilan mobile yang halus tanpa scroll horizontal */
        html,
        body {
            font-family: 'Inter', sans-serif;
            background-color: #E5E7EB;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Animasi transisi untuk progress bar dan bottom sheet */
        .progress-fill {
            transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.3s ease;
        }

        .bottom-sheet-backdrop {
            transition: opacity 0.25s ease;
        }

        .bottom-sheet-panel {
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Custom scrollbar tipis untuk area konten */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="min-h-screen flex justify-center items-start sm:py-4">

    <!-- Container Utama Mobile App -->
    <div id="app-shell"
        class="w-full max-w-[430px] min-h-screen sm:min-h-[844px] sm:rounded-[32px] sm:shadow-2xl sm:border-[6px] sm:border-[#1E242B] bg-[#F4F6F5] flex flex-col relative overflow-hidden">

        <!-- Top Status Bar (Simulasi Status Bar HP sesuai desain) -->
        <div
            class="bg-[#225E26] text-white px-5 pt-2.5 pb-1.5 flex items-center justify-between text-xs font-medium select-none">
            <span id="status-time" class="tracking-tight">07.42</span>
            <div class="flex items-center gap-1.5">
                <span class="text-[11px] font-semibold tracking-tight">4G</span>
                <!-- Ikon Sinyal -->
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="2" y="14" width="3" height="6" rx="0.8"></rect>
                    <rect x="7" y="11" width="3" height="9" rx="0.8"></rect>
                    <rect x="12" y="7" width="3" height="13" rx="0.8"></rect>
                    <rect x="17" y="3" width="3" height="17" rx="0.8"></rect>
                </svg>
                <!-- Ikon Baterai -->
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M16 4h-2V2h-4v2H8C6.9 4 6 4.9 6 6v14c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z">
                    </path>
                </svg>
            </div>
        </div>

        <!-- Header Hijau Utama -->
        <header class="bg-[#2E7D32] text-white px-5 pt-2 pb-5 shadow-sm">
            <div class="flex items-center justify-between gap-2">
                <button type="button" id="edit-block-btn"
                    class="text-left text-[13px] text-white/90 hover:text-white active:opacity-80 transition flex items-center gap-1 rounded-lg py-0.5 focus:outline-none"
                    title="Ketuk untuk mengubah nama blok">
                    <span id="header-subtitle">Blok [nama blok] · Operator: Rina</span>
                </button>

                <!-- Tombol Refresh Data Sensor -->
                <button type="button" id="refresh-btn"
                    class="p-1.5 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 transition text-white"
                    aria-label="Segarkan data sensor" title="Segarkan Data">
                    <svg id="refresh-icon" class="w-4 h-4 transition-transform duration-500" fill="none"
                        stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
            <h1 class="text-[22px] font-bold tracking-tight leading-snug mt-0.5">
                Status Tong Pintar
            </h1>
        </header>

        <!-- Konten Utama (Scrollable) -->
        <main id="main-content" class="flex-1 px-4 pt-4 pb-24 overflow-y-auto no-scrollbar space-y-3">

            <!-- Banner Peringatan Prioritas (Alert Card) -->
            <section id="priority-alert-container" aria-live="polite">
                <!-- Diisi secara dinamis lewat JavaScript -->
            </section>

            <!-- Daftar Kartu Status Lantai -->
            <section id="bins-list" class="space-y-3" aria-label="Daftar status tong per lantai">
                <!-- Kartu lantai 1 - 5 dirender oleh JavaScript -->
            </section>

        </main>

        <!-- Bottom Navigation Bar (5 Tab Sesuai Gambar) -->
        <nav class="bg-white border-t border-gray-200 px-2 pt-2 pb-3 flex items-center justify-around sticky bottom-0 z-20 select-none"
            aria-label="Navigasi Utama">

            <!-- Tab 1: Tong (Aktif) -->
            <a href="status.html" data-tab="Tong"
                class="nav-tab flex-1 flex flex-col items-center justify-center gap-1 py-1 rounded-xl text-[#2E7D32] font-semibold transition">
                <!-- Ikon Rumah / Tong Outline -->
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 10.5L12 3l9 7.5"></path>
                    <path d="M5 9.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9.5"></path>
                </svg>
                <span class="text-[11px] leading-none">Tong</span>
            </a>

            <!-- Tab 2: Catat -->
            <a href="catat.html" data-tab="Catat"
                class="nav-tab flex-1 flex flex-col items-center justify-center gap-1 py-1 rounded-xl text-[#757575] hover:text-gray-800 font-medium transition">
                <!-- Ikon Pensil -->
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1.003 1.003 0 0 0 0-1.42l-2.34-2.34a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82z" />
                </svg>
                <span class="text-[11px] leading-none">Catat</span>
            </a>

            <!-- Tab 3: Olah -->
            <a href="olah.html" data-tab="Olah"
                class="nav-tab flex-1 flex flex-col items-center justify-center gap-1 py-1 rounded-xl text-[#757575] hover:text-gray-800 font-medium transition">
                <!-- Ikon Daur Ulang -->
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5" />
                    <path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12" />
                    <path d="m14 16-3 3 3 3" />
                    <path d="M8.293 13.596 7.196 9.5 3.1 10.598" />
                    <path
                        d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843" />
                    <path d="m13.378 9.633 4.096 1.098 1.097-4.096" />
                </svg>
                <span class="text-[11px] leading-none">Olah</span>
            </a>

            <!-- Tab 4: Kas -->
            <a href="kas.html" data-tab="Kas"
                class="nav-tab flex-1 flex flex-col items-center justify-center gap-1 py-1 rounded-xl text-[#757575] hover:text-gray-800 font-medium transition">
                <!-- Ikon Rp -->
                <span
                    class="h-5 flex items-center justify-center text-[16px] font-bold tracking-tighter leading-none">Rp</span>
                <span class="text-[11px] leading-none">Kas</span>
            </a>

            <!-- Tab 5: Dampak -->
            <a href="dampak.html" data-tab="Dampak"
                class="nav-tab flex-1 flex flex-col items-center justify-center gap-1 py-1 rounded-xl text-[#757575] hover:text-gray-800 font-medium transition">
                <!-- Ikon Dokumen / Laporan -->
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M4 4h16v16H4V4zm3 4v2h10V8H7zm0 4v2h10v-2H7zm0 4v2h7v-2H7z" />
                </svg>
                <span class="text-[11px] leading-none">Dampak</span>
            </a>

        </nav>

        <!-- Toast Notification (Pengganti alert) -->
        <div id="toast-box"
            class="pointer-events-none fixed sm:absolute bottom-20 left-1/2 -translate-x-1/2 z-40 opacity-0 transition-all duration-300 translate-y-2 w-[90%] max-w-[380px]">
            <div id="toast-message"
                class="bg-gray-900/95 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-lg text-center">
                Pesan notifikasi
            </div>
        </div>

        <!-- Bottom Sheet Modal: Detail Tong & Aksi Penjemputan -->
        <div id="detail-modal" class="hidden fixed sm:absolute inset-0 z-30 flex items-end justify-center">
            <!-- Backdrop -->
            <div id="modal-backdrop" class="bottom-sheet-backdrop absolute inset-0 bg-black/45 opacity-0"></div>

            <!-- Panel Modal -->
            <div id="modal-panel"
                class="bottom-sheet-panel relative w-full bg-white rounded-t-3xl p-5 pb-7 shadow-2xl transform translate-y-full z-10">
                <div class="w-10 h-1.5 bg-gray-300 rounded-full mx-auto mb-4"></div>

                <div class="flex items-center justify-between mb-3">
                    <div>
                        <h2 id="modal-title" class="text-lg font-bold text-gray-900">Lantai 3</h2>
                        <p id="modal-subtitle" class="text-xs text-gray-500">Detail telemetri tong pintar</p>
                    </div>
                    <span id="modal-badge"
                        class="px-3 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-700">Jemput</span>
                </div>

                <div id="modal-body" class="bg-gray-50 rounded-2xl p-4 space-y-2.5 mb-5 border border-gray-100">
                    <!-- Info detail diisi dinamis -->
                </div>

                <div class="flex gap-2.5">
                    <button type="button" id="modal-close-btn"
                        class="flex-1 py-3 px-4 rounded-xl border border-gray-200 text-gray-700 font-semibold text-sm hover:bg-gray-50 active:scale-[0.99] transition">
                        Tutup
                    </button>
                    <button type="button" id="modal-action-btn"
                        class="flex-[1.6] py-3 px-4 rounded-xl bg-[#2E7D32] text-white font-semibold text-sm hover:bg-[#246627] active:scale-[0.99] transition shadow-sm">
                        Tandai Dijemput
                    </button>
                </div>
            </div>
        </div>

        <!-- Bottom Sheet Modal: Ubah Nama Blok -->
        <div id="block-modal" class="hidden fixed sm:absolute inset-0 z-30 flex items-end justify-center">
            <div id="block-backdrop" class="bottom-sheet-backdrop absolute inset-0 bg-black/45 opacity-0"></div>
            <div id="block-panel"
                class="bottom-sheet-panel relative w-full bg-white rounded-t-3xl p-5 pb-7 shadow-2xl transform translate-y-full z-10">
                <div class="w-10 h-1.5 bg-gray-300 rounded-full mx-auto mb-4"></div>
                <h2 class="text-base font-bold text-gray-900 mb-1">Pengaturan Blok & Operator</h2>
                <p class="text-xs text-gray-500 mb-4">Sesuaikan nama blok yang sedang dipantau oleh operator.</p>

                <div class="space-y-3 mb-5">
                    <div>
                        <label for="input-block-name" class="block text-xs font-semibold text-gray-700 mb-1">Nama
                            Blok</label>
                        <input id="input-block-name" type="text" placeholder="Contoh: Blok Melati A"
                            class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-[#2E7D32]" />
                    </div>
                    <div>
                        <label for="input-operator-name" class="block text-xs font-semibold text-gray-700 mb-1">Nama
                            Operator</label>
                        <input id="input-operator-name" type="text" value="Rina"
                            class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-[#2E7D32]" />
                    </div>
                </div>

                <div class="flex gap-2.5">
                    <button type="button" id="block-cancel-btn"
                        class="flex-1 py-3 px-4 rounded-xl border border-gray-200 text-gray-700 font-semibold text-sm hover:bg-gray-50 transition">
                        Batal
                    </button>
                    <button type="button" id="block-save-btn"
                        class="flex-1 py-3 px-4 rounded-xl bg-[#2E7D32] text-white font-semibold text-sm hover:bg-[#246627] transition">
                        Simpan
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        /**
         * State & Data Awal untuk Halaman "sttaus-tong-pintar"
         * Mencerminkan persis seluruh angka, status, warna, dan teks dari referensi gambar.
         */
        const appState = {
            blockName: '[nama blok]',
            operatorName: 'Rina',
            activeTab: 'Tong',
            maxCapacityKg: 11.5, // 9.8 kg setara ~85% kapasitas
            bins: [
                {
                    id: 1,
                    floor: 'Lantai 1',
                    status: 'Aman', // 'Aman' | 'Segera' | 'Jemput' | 'Sensor off'
                    weightKg: 4.1,
                    ageHours: 12,
                    tempC: 30,
                    percent: 36,
                    sensorActive: true,
                    fixedSchedule: ''
                },
                {
                    id: 2,
                    floor: 'Lantai 2',
                    status: 'Segera',
                    weightKg: 7.9,
                    ageHours: 30,
                    tempC: 32,
                    percent: 69,
                    sensorActive: true,
                    fixedSchedule: ''
                },
                {
                    id: 3,
                    floor: 'Lantai 3',
                    status: 'Jemput',
                    weightKg: 9.8,
                    ageHours: 46,
                    tempC: 34,
                    percent: 85,
                    sensorActive: true,
                    fixedSchedule: ''
                },
                {
                    id: 4,
                    floor: 'Lantai 4',
                    status: 'Aman',
                    weightKg: 2.6,
                    ageHours: 8,
                    tempC: 30,
                    percent: 23,
                    sensorActive: true,
                    fixedSchedule: ''
                },
                {
                    id: 5,
                    floor: 'Lantai 5',
                    status: 'Sensor off',
                    weightKg: 0,
                    ageHours: 0,
                    tempC: null,
                    percent: 0,
                    sensorActive: false,
                    fixedSchedule: 'Jadwal tetap: jemput tiap 2 hari'
                }
            ]
        };

        // Referensi Elemen DOM
        const priorityAlertContainer = document.getElementById('priority-alert-container');
        const binsListEl = document.getElementById('bins-list');
        const headerSubtitleEl = document.getElementById('header-subtitle');
        const toastBox = document.getElementById('toast-box');
        const toastMessage = document.getElementById('toast-message');
        let toastTimer = null;
        let selectedBinId = null;

        /**
         * Format angka desimal menggunakan koma ala Bahasa Indonesia (contoh: 4.1 -> "4,1")
         */
        function formatDecimalID(num) {
            return Number(num).toFixed(1).replace('.', ',');
        }

        /**
         * Menampilkan pesan toast halus di bagian bawah layar
         */
        function showToast(msg) {
            if (toastTimer) clearTimeout(toastTimer);
            toastMessage.textContent = msg;
            toastBox.classList.remove('opacity-0', 'translate-y-2');
            toastBox.classList.add('opacity-100', 'translate-y-0');

            toastTimer = setTimeout(() => {
                toastBox.classList.remove('opacity-100', 'translate-y-0');
                toastBox.classList.add('opacity-0', 'translate-y-2');
            }, 2600);
        }

        /**
         * Mendapatkan konfigurasi warna badge dan progress bar berdasarkan status
         */
        function getStatusStyle(status) {
            switch (status) {
                case 'Aman':
                    return {
                        badgeBg: 'bg-[#E8F5E9]',
                        badgeText: 'text-[#2E7D32]',
                        barColor: 'bg-[#389E3C]'
                    };
                case 'Segera':
                    return {
                        badgeBg: 'bg-[#FEF3C7]',
                        badgeText: 'text-[#B45309]',
                        barColor: 'bg-[#F59E0B]'
                    };
                case 'Jemput':
                    return {
                        badgeBg: 'bg-[#FEE2E2]',
                        badgeText: 'text-[#DC2626]',
                        barColor: 'bg-[#E53935]'
                    };
                default: // 'Sensor off'
                    return {
                        badgeBg: 'bg-[#E2E8F0]',
                        badgeText: 'text-[#475569]',
                        barColor: 'bg-gray-300'
                    };
            }
        }

        /**
         * Merender Banner Peringatan Prioritas di bagian paling atas konten
         */
        function renderPriorityAlert() {
            // Cari tong dengan status 'Jemput' (prioritas tertinggi)
            const urgentBin = appState.bins.find(b => b.status === 'Jemput');

            if (urgentBin) {
                priorityAlertContainer.innerHTML = `
          <div 
            role="button"
            tabindex="0"
            onclick="openBinModal(${urgentBin.id})"
            class="bg-[#FDECEC] border-[1.5px] border-[#E57373] rounded-xl px-3.5 py-3 shadow-xs cursor-pointer hover:bg-[#fbdcdc] active:scale-[0.99] transition"
          >
            <div class="flex items-center gap-2 text-[#B91C1C] font-bold text-[15px] leading-snug">
              <!-- Ikon Segitiga Peringatan Merah -->
              <svg class="w-4 h-4 shrink-0 fill-current" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
              </svg>
              <span>${urgentBin.floor} perlu dijemput</span>
            </div>
            <p class="text-[#4B5563] text-[13px] mt-0.5 leading-snug">
              Berat ${urgentBin.percent}% · sampah berumur ${urgentBin.ageHours} jam
            </p>
          </div>
        `;
            } else {
                // Jika semua tong sudah dijemput / aman
                priorityAlertContainer.innerHTML = `
          <div class="bg-[#E8F5E9] border-[1.5px] border-[#81C784] rounded-xl px-3.5 py-3">
            <div class="flex items-center gap-2 text-[#2E7D32] font-bold text-[15px] leading-snug">
              <svg class="w-4 h-4 shrink-0 fill-current" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
              </svg>
              <span>Semua lantai dalam kondisi terkendali</span>
            </div>
            <p class="text-[#4B5563] text-[13px] mt-0.5 leading-snug">
              Tidak ada tong yang melewati batas penjemputan saat ini
            </p>
          </div>
        `;
            }
        }

        /**
         * Merender seluruh kartu status Lantai 1 hingga Lantai 5
         */
        function renderBinsList() {
            binsListEl.innerHTML = appState.bins.map(bin => {
                const style = getStatusStyle(bin.status);

                if (!bin.sensorActive) {
                    // Tampilan khusus Lantai 5 ("Sensor off") tanpa progress bar
                    return `
            <article 
              onclick="openBinModal(${bin.id})"
              class="bg-white rounded-2xl px-4 py-3.5 shadow-[0_1px_3px_rgba(0,0,0,0.05)] border border-gray-100 cursor-pointer hover:border-gray-200 active:scale-[0.99] transition"
            >
              <div class="flex items-center justify-between">
                <h2 class="text-[15px] font-bold text-[#1F2937]">${bin.floor}</h2>
                <span class="${style.badgeBg} ${style.badgeText} text-xs font-semibold px-3 py-0.5 rounded-full">
                  ${bin.status}
                </span>
              </div>
              <p class="text-[13px] text-[#6B7280] mt-1">
                ${bin.fixedSchedule}
              </p>
            </article>
          `;
                }

                // Tampilan kartu aktif dengan progress bar & telemetri (Lantai 1 - 4)
                return `
          <article 
            onclick="openBinModal(${bin.id})"
            class="bg-white rounded-2xl px-4 py-3.5 shadow-[0_1px_3px_rgba(0,0,0,0.05)] border border-gray-100 cursor-pointer hover:border-gray-200 active:scale-[0.99] transition"
          >
            <div class="flex items-center justify-between mb-2">
              <h2 class="text-[15px] font-bold text-[#1F2937]">${bin.floor}</h2>
              <span class="${style.badgeBg} ${style.badgeText} text-xs font-semibold px-3 py-0.5 rounded-full">
                ${bin.status}
              </span>
            </div>

            <!-- Progress Bar -->
            <div class="w-full h-[7px] bg-[#E5E7EB] rounded-full overflow-hidden mb-2">
              <div 
                class="progress-fill h-full ${style.barColor} rounded-full" 
                style="width: ${bin.percent}%"
              ></div>
            </div>

            <!-- Metadata: Berat, Umur Sampah, Suhu -->
            <p class="text-[13px] text-[#6B7280] tracking-tight">
              ${formatDecimalID(bin.weightKg)} kg · ${bin.ageHours} jam · ${bin.tempC}°C
            </p>
          </article>
        `;
            }).join('');
        }

        /**
         * Render keseluruhan UI utama
         */
        function renderApp() {
            headerSubtitleEl.textContent = `Blok ${appState.blockName} · Operator: ${appState.operatorName}`;
            renderPriorityAlert();
            renderBinsList();
        }

        /**
         * Membuka Bottom Sheet Modal untuk detail lantai & aksi penjemputan
         */
        const detailModal = document.getElementById('detail-modal');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalPanel = document.getElementById('modal-panel');
        const modalTitle = document.getElementById('modal-title');
        const modalSubtitle = document.getElementById('modal-subtitle');
        const modalBadge = document.getElementById('modal-badge');
        const modalBody = document.getElementById('modal-body');
        const modalActionBtn = document.getElementById('modal-action-btn');

        window.openBinModal = function (binId) {
            const bin = appState.bins.find(b => b.id === binId);
            if (!bin) return;
            selectedBinId = binId;

            const style = getStatusStyle(bin.status);
            modalTitle.textContent = bin.floor;
            modalBadge.className = `px-3 py-1 rounded-full text-xs font-semibold ${style.badgeBg} ${style.badgeText}`;
            modalBadge.textContent = bin.status;

            if (!bin.sensorActive) {
                modalSubtitle.textContent = 'Mode penjadwalan manual';
                modalBody.innerHTML = `
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">Status Sensor</span>
            <span class="font-semibold text-gray-800">Nonaktif (Offline)</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">Jadwal Penjemputan</span>
            <span class="font-semibold text-gray-800">Tiap 2 hari sekali</span>
          </div>
        `;
                modalActionBtn.textContent = 'Aktifkan Sensor';
            } else {
                modalSubtitle.textContent = `Kapasitas terisi ${bin.percent}% dari maksimal ${formatDecimalID(appState.maxCapacityKg)} kg`;
                modalBody.innerHTML = `
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">Berat Sampah</span>
            <span class="font-semibold text-gray-800">${formatDecimalID(bin.weightKg)} kg (${bin.percent}%)</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">Umur Sampah</span>
            <span class="font-semibold text-gray-800">${bin.ageHours} jam</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">Suhu Tong</span>
            <span class="font-semibold text-gray-800">${bin.tempC}°C</span>
          </div>
        `;
                modalActionBtn.textContent = 'Konfirmasi Dijemput';
            }

            detailModal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modalBackdrop.classList.remove('opacity-0');
                modalBackdrop.classList.add('opacity-100');
                modalPanel.classList.remove('translate-y-full');
                modalPanel.classList.add('translate-y-0');
            });
        };

        function closeBinModal() {
            modalBackdrop.classList.remove('opacity-100');
            modalBackdrop.classList.add('opacity-0');
            modalPanel.classList.remove('translate-y-0');
            modalPanel.classList.add('translate-y-full');
            setTimeout(() => {
                detailModal.classList.add('hidden');
                selectedBinId = null;
            }, 280);
        }

        document.getElementById('modal-close-btn').addEventListener('click', closeBinModal);
        modalBackdrop.addEventListener('click', closeBinModal);

        modalActionBtn.addEventListener('click', () => {
            const bin = appState.bins.find(b => b.id === selectedBinId);
            if (!bin) return;

            if (!bin.sensorActive) {
                bin.sensorActive = true;
                bin.status = 'Aman';
                bin.weightKg = 1.2;
                bin.ageHours = 2;
                bin.tempC = 29;
                bin.percent = 10;
                showToast(`Sensor ${bin.floor} berhasil diaktifkan`);
            } else {
                bin.status = 'Aman';
                bin.weightKg = 0.0;
                bin.ageHours = 0;
                bin.tempC = 29;
                bin.percent = 4;
                showToast(`Sampah ${bin.floor} telah ditandai dijemput`);
            }

            renderApp();
            closeBinModal();
        });

        /**
         * Modal Pengaturan Nama Blok & Operator
         */
        const blockModal = document.getElementById('block-modal');
        const blockBackdrop = document.getElementById('block-backdrop');
        const blockPanel = document.getElementById('block-panel');
        const inputBlockName = document.getElementById('input-block-name');
        const inputOperatorName = document.getElementById('input-operator-name');

        function openBlockModal() {
            inputBlockName.value = appState.blockName === '[nama blok]' ? '' : appState.blockName;
            inputOperatorName.value = appState.operatorName;
            blockModal.classList.remove('hidden');
            requestAnimationFrame(() => {
                blockBackdrop.classList.remove('opacity-0');
                blockBackdrop.classList.add('opacity-100');
                blockPanel.classList.remove('translate-y-full');
                blockPanel.classList.add('translate-y-0');
            });
        }

        function closeBlockModal() {
            blockBackdrop.classList.remove('opacity-100');
            blockBackdrop.classList.add('opacity-0');
            blockPanel.classList.remove('translate-y-0');
            blockPanel.classList.add('translate-y-full');
            setTimeout(() => {
                blockModal.classList.add('hidden');
            }, 280);
        }

        document.getElementById('edit-block-btn').addEventListener('click', openBlockModal);
        document.getElementById('block-cancel-btn').addEventListener('click', closeBlockModal);
        blockBackdrop.addEventListener('click', closeBlockModal);

        document.getElementById('block-save-btn').addEventListener('click', () => {
            const newBlock = inputBlockName.value.trim();
            const newOp = inputOperatorName.value.trim();
            appState.blockName = newBlock || '[nama blok]';
            appState.operatorName = newOp || 'Rina';
            renderApp();
            closeBlockModal();
            showToast('Informasi blok & operator diperbarui');
        });

        /**
         * Tombol Refresh Sensor
         */
        document.getElementById('refresh-btn').addEventListener('click', () => {
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('rotate-180');
            setTimeout(() => icon.classList.remove('rotate-180'), 500);
            showToast('Data sensor tong pintar telah disinkronkan');
        });

        /**
         * Navigasi Tab Bawah (Tong, Catat, Olah, Kas, Dampak)
         */
        const navTabs = document.querySelectorAll('.nav-tab');
        navTabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                const targetTab = tab.dataset.tab;
                if (targetTab === 'Tong') {
                    e.preventDefault();
                    const mainContent = document.getElementById('main-content');
                    if (mainContent) {
                        mainContent.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                }
            });
        });

        // Inisialisasi Tampilan Awal
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });
    </script>
</body>

</html>
